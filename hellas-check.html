on geometry(){const rotated=portraitMap();return G.board(state).map(c=>{const x=(c.q+c.r/2)*34.64,y=c.r*30;return rotated?{x:y,y:-x}:{x,y};});}\nfunction drawBoard(focus=null){const pos=geometry(),xs=pos.map(p=>p.x),ys=pos.map(p=>p.y),minx=focus===null?Math.min(...xs)-22:pos[focus].x-90,miny=focus===null?Math.min(...ys)-22:pos[focus].y-80,w=focus===null?Math.max(...xs)-minx+22:180,h=focus===null?Math.max(...ys)-miny+22:160,allowed=eligible();\n const shapes=G.board(state).map((b,id)=>{const t=state.cells[id],{x,y}=pos[id];if(focus!==null&&(Math.abs(x-pos[focus].x)>75||Math.abs(y-pos[focus].y)>62))return '';const changed=state.event?.cells?.includes(id),sel=selectedCell===id,able=allowed.has(id),base='\u003cpolygon class=\"tile\" points=\"'+(portraitMap()?'-20,0 -10,-17.32 10,-17.32 20,0 10,17.32 -10,17.32':'0,-20 17.32,-10 17.32,10 0,20 -17.32,10 -17.32,-10')+'\"/>',label='\u003ctext class=\"cell-label\" x=\"0\" y=\"-10\" text-anchor=\"middle\">'+b.label+'\u003c/text>';let art='';\n  if(b.type==='quarry'){art=t?'\u003ctext class=\"cell-icon\" x=\"0\" y=\"5\" text-anchor=\"middle\" fill=\"'+(t.closed?'#6b7976':'#315f62')+'\">'+(t.closed?'×':G.income(t.rank))+'\u003c/text>\u003ctext class=\"cell-info\" x=\"0\" y=\"14\" text-anchor=\"middle\">#'+t.rank+'\u003c/text>':state.worker===id?'\u003ctext x=\"0\" y=\"11\" text-anchor=\"middle\" font-size=\"23\" fill=\"#79573a\">♟\u003c/text>':'\u003ctext x=\"0\" y=\"9\" text-anchor=\"middle\" font-size=\"18\" fill=\"#6e8782\">◇\u003c/text>';}\n  else if(b.type==='temple'){const n=t?.pillars||0,i=templeIds().indexOf(id),draft=state.phase==='temple'?pillars[i]:0;art='\u003cpath d=\"M-12 -3L0 -8L12 -3Z\" fill=\"#aa9065\"/>\u003cpath d=\"M-9 -2V7M0 -2V7M9 -2V7\" stroke=\"#a88f65\" stroke-width=\"3\"/>\u003ctext class=\"cell-info\" x=\"0\" y=\"16\" text-anchor=\"middle\">'+n+(draft?'+'+draft:'')+'/'+b.capacity+'\u003c/text>';}\n  else if(t?.type==='statue')art='\u003ctext x=\"0\" y=\"12\" text-anchor=\"middle\" font-size=\"25\" fill=\"#8a724a\">♜\u003c/text>';\n  else if(t){const color=COLORS[t.owner];art=t.type==='house'?'\u003cpath class=\"tile-building\" d=\"M-11 1L0 -7L11 1V12H-11Z\" fill=\"'+color+'\"/>':t.type==='palace'?'\u003cpath class=\"tile-building\" d=\"M-13 -3H-7V1H-3V-5H3V1H7V-3H13V13H-13Z\" fill=\"'+color+'\"/>':'\u003crect class=\"tile-building\" x=\"-12\" y=\"-1\" width=\"24\" height=\"13\" rx=\"2\" fill=\"'+color+'\"/>';art+='\u003ctext x=\"0\" y=\"9\" text-anchor=\"middle\" fill=\"white\" font-size=\"10\" font-weight=\"700\">'+(t.owner+1)+'\u003c/text>';}\n  return '\u003cg role=\"button\" tabindex=\"0\" aria-label=\"'+esc(cellDescription(id)+(able?' · 선택 가능':''))+'\" data-cell=\"'+id+'\" transform=\"translate('+x+' '+y+')\" class=\"cell '+b.type+(b.coast?' coast':'')+(able?' eligible':human()&&state.phase!=='choose'?' inactive':'')+(sel?' selected':'')+(changed?' changed':'')+'\">'+base+label+art+'\u003c/g>';\n }).join('');return '\u003csvg viewBox=\"'+[minx,miny,w,h].join(' ')+'\" role=\"group\" aria-label=\"'+(state.boardName==='pegasus'?'2인 페가수스':'3~4인 미노타우로스')+' 섬\">'+shapes+'\u003c/svg>';}\nfunction chooseCell(id){if(panel==='location'){selectedCell=id;mapCenter=id;if(human()&&state.phase==='temple'){const i=templeIds().indexOf(id);if(i>=0){if(eligible().has(id))pillars[i]++;else if(pillars[i])pillars[i]=0;}}render();return;}if(!human()){selectedCell=id;openPanel('inspect');return;}if(state.phase==='temple'){const i=templeIds().indexOf(id);if(i>=0){if(eligible().has(id))pillars[i]++;else if(pillars[i])pillars[i]=0;selectedCell=id;render();return;}}selectedCell=id;const a=targetAction(id);if(a&&G.legal(state,a))render();else openPanel('inspect');}\nfunction render(){seats.sync();if(seats.locked)closePanel(false);const p=state.players[state.current],visible=seats.privateVisible();$('players').style.setProperty('--count',state.players.length);$('players').innerHTML=state.players.map((x,i)=>'\u003carticle class=\"player '+(i===state.current?'active':'')+'\" style=\"--player:'+COLORS[i]+'\">\u003ch3>'+esc(x.name)+'\u003c/h3>\u003cstrong>◇ '+(state.result||i===viewer()&&visible?x.marble:'?')+'\u003c/strong>\u003cp>반지 '+x.rings+' · 행동 '+x.markers+'회 · ⌂ '+x.pieces.house+' / ▰ '+x.pieces.palace+' / ▪ '+x.pieces.square+'\u003c/p>\u003c/article>').join('');$('turn-title').textContent=state.result?'최종 결과':p.name+'의 차례'+(human()?' · ◇ '+p.marble:'');$('phase-title').textContent=state.round+' / 3 라운드 · '+(state.selected?.name||PHASE[state.phase]);$('cover').hidden=!seats.shared();$('cover').disabled=!human();$('round-strip').innerHTML=[1,2,3].map(n=>'\u003cspan class=\"round '+(n===state.round?'active':'')+'\">'+n+'라운드\u003c/span>').join('')+'\u003cspan class=\"remaining\">남은 행동 '+G.sum(state.players.map(x=>x.markers))+' · 반지 '+p.rings+'\u003c/span>';$('board').innerHTML=seats.locked?'':drawBoard();$('event-label').textContent=state.log.filter(e=>e.kind!=='ai').at(-1)?.text||'';$('prompt').textContent=prompt();\n const kind=activePiece();$('pieces').innerHTML=human()&&state.phase==='build'?state.remainingKinds.map(k=>'\u003cbutton draggable=\"false\" data-piece=\"'+k+'\" aria-pressed=\"'+(k===kind)+'\" '+(!p.pieces[k]?'disabled':'')+'>'+({house:'⌂',square:'▪',palace:'▰'}[k])+' '+G.PIECES[k]+' '+p.pieces[k]+'\u003c/button>').join('')+(G.legal(state,{type:'skip'})?'\u003cbutton data-act=\"'+esc(JSON.stringify({type:'skip'}))+'\">생략\u003c/button>':''):human()&&state.phase==='temple'?'\u003cbutton data-panel=\"action\">기둥 배분 ±\u003c/button>\u003cbutton data-temple-clear>초기화\u003c/button>':human()&&state.phase==='statue'?'\u003cbutton data-piece=\"statue\" draggable=\"false\">♜ 조각상\u003c/button>\u003cbutton data-act=\"'+esc(JSON.stringify({type:'skip'}))+'\">생략\u003c/button>':'';\n const a=targetAction(selectedCell);$('cell-label').textContent=selectedCell===null?'':cellDescription(selectedCell);$('confirm').disabled=false;$('confirm').textContent=state.result?'점수·총평 보기':!human()?'AI 진행·속도':state.phase==='choose'?'행동 선택 →':state.phase==='temple'?'기둥 '+G.sum(pillars)+' / '+state.selected.pillars+'개 배분 확정':a&&G.legal(state,a)?(a.type==='build'?G.PIECES[a.kind]+' 건설 · ◇ '+G.cost(state,a.cell,a.kind):a.type==='statue'?'조각상 건설 · ◇ 7':'이곳에 배치 확정'):'밝은 칸을 선택하세요';if(human()&&state.phase!=='choose')$('confirm').disabled=state.phase==='temple'?!G.legal(state,{type:'temple',amounts:pillars}):!a||!G.legal(state,a);\n $('actions').innerHTML='\u003ch2>'+esc(state.result?'게임 종료':PHASE[state.phase])+'\u003c/h2>\u003cp>'+esc(prompt())+'\u003c/p>\u003cbutton data-panel=\"'+(state.result?'result':'action')+'\" class=\"primary\">'+(state.result?'점수·총평':state.phase==='choose'?'행동 선택':'행동 상세')+'\u003c/button>';$('ai-controls').innerHTML=playback();$('journal').innerHTML=state.log.slice(-6).reverse().map(entry).join('');if(panel)renderPanel();if(state.result&&!resultShown){resultShown=true;openPanel('result');}}\nfunction rules(){return [\n '\u003ch3>같이 짓는 세 라운드\u003c/h3>\u003cp>2~4명, 각자 대리석 10개로 시작합니다. 행동칸은 한 라운드에 한 번만 사용할 수 있습니다. 1·2라운드에는 12개 행동 마커를 똑같이 나눕니다. 3라운드에는 한 사람당 1개씩 줄입니다.\u003c/p>\u003cp>집·집+광장·궁전은 선택한 사람부터 시계 방향으로 모두 건설할 수 있습니다. 참여하지 않아도 됩니다.\u003c/p>',\n '\u003ch3>집, 광장, 궁전\u003c/h3>\u003cp>집과 광장은 해안 1 / 내륙 2, 궁전은 해안 5 / 내륙 7 대리석이 듭니다. 각 행동에서 해당 건물을 최대 1개씩 짓습니다. 집+광장은 하나만 지어도 됩니다.\u003c/p>\u003cp>같은 색의 연결된 집과 궁전이 있어야 도시입니다. 광장은 연결을 돕습니다. 도시가 아닌 마을은 도시·신전·조각상 점수를 받지 못합니다.\u003c/p>',\n '\u003ch3>채굴과 채석장\u003c/h3>\u003cp>모든 플레이어가 활성 채석장 옆의 집마다 표시된 생산량을 얻습니다. 궁전·광장은 생산하지 않습니다.\u003c/p>\u003cp>행동을 고른 사람이 타일을 1개씩 공개하여 더 낮은 번호의 활성 채석장에 놓습니다. 폐쇄가 일어나지 않으면 4개까지 반드시 계속합니다.\u003c/p>',\n '\u003ch3>채석장 폐쇄\u003c/h3>\u003cp>새 타일보다 번호가 작은 활성 채석장이 없으면 일꾼 위치에 새 채석장이 열립니다. 가장 높은 번호의 기존 채석장은 영구 폐쇄됩니다.\u003c/p>\u003cp>일꾼을 빈 채석장으로 옮기고 이 행동을 마칩니다. 다음 타일을 미리 볼 수 없습니다.\u003c/p>',\n '\u003ch3>기둥과 반지\u003c/h3>\u003cp>기둥 2 / 3 / 5개를 정확히 짓고 대리석 4 / 6 / 10개를 냅니다. 여러 신전에 나눠도 됩니다. 반지 1개, 신전 하나를 완공할 때마다 추가 반지 1개를 받습니다.\u003c/p>\u003cp>매 라운드 처음 기둥 행동을 고른 사람이 다음 라운드 선 플레이어가 됩니다. 기둥 건설을 생략해도 선점은 유효합니다.\u003c/p>',\n '\u003ch3>조각상과 보충\u003c/h3>\u003cp>조각상은 대리석 7개로 내륙의 빈 땅에만 짓습니다. 전체 3개이며 모두의 도시가 혜택을 받을 수 있습니다.\u003c/p>\u003cp>대리석 +3 행동은 선택한 사람만 3개를 얻습니다. 비용을 낼 수 없거나 원하지 않으면 선택한 건설을 생략할 수 있습니다.\u003c/p>',\n '\u003ch3>최종 점수\u003c/h3>\u003cp>가장 큰 도시의 건물 1개당 1점. 각 도시마다 인접한 신전의 기둥 1개당 1점, 인접 조각상 하나당 3점입니다. 같은 도시가 같은 신전에 여러 면으로 닿아도 한 번만 받습니다.\u003c/p>\u003cp>반지 하나당 2점, 최다 보유자 모두 +3점. 남은 대리석 5개당 1점. 최다 점수 동률은 공동 승리입니다.\u003c/p>',\n '\u003ch3>조작과 AI\u003c/h3>\u003cp>밝은 칸을 누르고 큰 버튼으로 확정하거나, 건물을 그곳으로 끌어 놓습니다. 개인보드와 기록은 아래 버튼으로 펼칩니다. 사람 차례가 바뀌면 준비 화면으로 비공개 대리석을 가립니다.\u003c/p>\u003cp>AI는 채굴, 도시 연결, 공동 행동의 상대 이익, 반지와 기둥을 비교합니다. 미공개 타일 순서는 보지 않습니다.\u003c/p>',\n '\u003ch3>규칙·전략 출처\u003c/h3>\u003cp>Stefan Dorra, Hellas (2016). 기본 규칙에 따른 비공식 개인용 앱입니다.\u003c/p>\u003cp>\u003ca href=\"https://www.yucata.de/en/Rules/Hellas\" target=\"_blank\" rel=\"noreferrer\">공식 허가 규칙 제공\u003c/a> · \u003ca href=\"https://dorra-spiele.de/hellas/\" target=\"_blank\" rel=\"noreferrer\">작가의 전략 설명\u003c/a> · \u003ca href=\"https://opinionatedgamers.com/2026/10/04/dale-yu-review-of-hellas/\" target=\"_blank\" rel=\"noreferrer\">Dale Yu 플레이 후기\u003c/a> · \u003ca href=\"https://dicedaniel.nl/review-hellas-playte/\" target=\"_blank\" rel=\"noreferrer\">Dice Daniel 후기\u003c/a>\u003c/p>\u003cp>대리석 공개·추가 동점 판정 등 Yucata의 별도 변경 규칙은 적용하지 않습니다.\u003c/p>'\n ];}\nfunction setup(n){setupPage=n;$('setup-form').querySelectorAll('[data-setup-page]').forEach(el=>el.hidden=Number(el.dataset.setupPage)!==n);$('setup-form').querySelector('[data-setup-back]').hidden=n===0;$('setup-form').querySelector('[data-setup-next]').hidden=n===1;$('setup-form').querySelector('[type=submit]').hidden=n===0;$('setup-step').textContent=(n+1)+' / 2';}\ndocument.addEventListener('click',e=>{if(Date.now()\u003csuppressClickUntil){e.preventDefault();return;}const b=e.target.closest('button,[data-cell]');if(!b||seats.locked||b.disabled)return;\n if(b.hasAttribute('data-close')){closePanel();return;}if(b.hasAttribute('data-setup-close')){$('setup-dialog').close();schedule();return;}if(b.hasAttrib ribute('data-ai-pause')){paused=!paused;stop();render();schedule();return;}if(b.hasAttribute('data-ai-step')){paused=true;stop();closePanel(false);aiStep();render();return;}\n if(b.id==='cover'){$('local-cover').click();return;}\n if(b.hasAttribute('data-undo')){if(!history.length||!human())return;stop();closePanel(false);state=history.pop();resultShown=false;clearDraft();save();render();schedule();return;}\n if(b.hasAttribute('data-export')){const url=URL.createObjectURL(new Blob([JSON.stringify({format:'hellas-solo',version:1,state,history})],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='hellas-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}\n if(b.hasAttribute('data-import')){stop();importGeneration=generation;$('import-file').value='';$('import-file').click();return;}\n});\ndocument.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-cell]')){e.preventDefault();chooseCell(Number(e.target.dataset.cell));}});\ndocument.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-piece]');if(!b||!human()||e.button>0)return;gesture={id:e.pointerId,kind:b.dataset.piece,x:e.clientX,y:e.clientY,moved:false};});\ndocument.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8){gesture.moved=true;piece=gesture.kind;e.preventDefault();}},{passive:false});\ndocument.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const g=gesture;gesture=null;if(!g.moved)return;suppressClickUntil=Date.now()+450;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');if(target){piece=g.kind;const a=targetAction(Number(target.dataset.cell));if(a&&G.legal(state,a)){e.preventDefault();execute(a);}}});document.addEventListener('pointercancel',()=>gesture=null);\n$('setup-form').addEventListener('submit',e=>{e.preventDefault();if(setupPage!==1){setup(1);
